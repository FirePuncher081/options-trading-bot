name: Research checks and dashboard deployment
on:
  push:
    branches: [main, my-first-code]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: options-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m compileall -q options_lab dashboard scripts
      - run: python -m pytest -q
      - run: python -m options_lab research
      - run: python dashboard/build_data.py
      - run: python scripts/check_notebooks.py
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-and-site
          path: |
            artifacts/research/report.json
            artifacts/executed-notebooks/
            index.html
            dashboard/app.js
            dashboard/style.css
            dashboard/data.js
      - name: Check generated data matches the committed export
        run: git diff --exit-code -- dashboard/data.js
      - name: Stage the static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/my-first-code'
        run: |
          mkdir -p artifacts/site/dashboard
          cp index.html artifacts/site/
          cp dashboard/app.js dashboard/style.css dashboard/data.js artifacts/site/dashboard/
          touch artifacts/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/my-first-code'
        with:
          path: artifacts/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/my-first-code'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages publishing source
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            let pages;
            try {
              pages = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const enabled = pages?.data.build_type === 'workflow';
            if (!enabled) {
              const message = 'Deployment skipped: choose GitHub Actions in Settings > Pages > Build and deployment, then rerun this workflow.';
              core.notice(message);
              await core.summary.addRaw(message).write();
            }
            return enabled;
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.result == 'true'
      - name: Deploy the validated site
        if: steps.pages.outputs.result == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
